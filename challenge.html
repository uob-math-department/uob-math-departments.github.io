<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Math Escape Challenge</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#5d6678;--acc:#8a1c2b;--acc2:#f1d9dc;--ok:#1f7a4d;--bad:#b3261e;--line:#ddd8cc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1e222d;--ink:#eceef4;--mute:#a1a8b8;--acc:#e0707f;--acc2:#3a2227;--ok:#5fcf97;--bad:#ff8a80;--line:#343a49}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1e222d;--ink:#eceef4;--mute:#a1a8b8;--acc:#e0707f;--acc2:#3a2227;--ok:#5fcf97;--bad:#ff8a80;--line:#343a49}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin-bottom:10px}
.prog{height:6px;background:var(--line);border-radius:3px;margin-bottom:14px;overflow:hidden}
.prog div{height:100%;background:var(--acc);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h1{font-size:26px;margin:0 0 8px}h2{font-size:21px;margin:0 0 6px}
.tag{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:6px}
.puzzle{background:var(--acc2);border-radius:10px;padding:14px;margin:12px 0;font-size:18px}
.big{font-size:44px;font-weight:700;text-align:center;margin:8px 0}
input{width:100%;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:8px 0}
input:focus{outline:none;border-color:var(--acc)}
button{font:inherit;font-weight:600;padding:12px 18px;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer;margin:4px 4px 4px 0}
button.alt{background:transparent;color:var(--acc);border:2px solid var(--acc)}
button:disabled{opacity:.45}
.msg{margin:10px 0;font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}
.note{color:var(--mute);font-size:15px}
.doors{display:flex;gap:10px;margin:14px 0}
.door{flex:1;height:120px;font-size:34px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0}
.door small{font-size:13px;font-weight:600}
.door.sel{border-color:var(--acc);background:var(--acc2)}
table{width:100%;border-collapse:collapse;margin:10px 0}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar" hidden><span id="tm"></span><span id="sc"></span></div>
  <div class="prog" id="pg" hidden><div id="pgi"></div></div>
  <div class="card" id="app"></div>
</div>
<script>
var app=document.getElementById('app');
var S={team:'',score:0,t0:0,step:0,detail:[]};
var timer=null;
function $(id){return document.getElementById(id)}
function fmt(s){var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r}
function head(){
  $('bar').hidden=false;$('pg').hidden=false;
  $('tm').textContent=S.team;$('sc').textContent='Score: '+S.score;
  $('pgi').style.width=(S.step/5*100)+'%';
}
function go(n){S.step=n;if(timer){clearInterval(timer);timer=null}head();window.scrollTo(0,0);[intro,r1,r2,r3,r4,r5,final][n]()}
function award(label,pts){S.score+=pts;S.detail.push([label,pts]);head()}
function nextBtn(){return '<button id="nx">Continue</button>'}
function bindNext(){$('nx').onclick=function(){go(S.step+1)}}

/* one submission per question: grade, then explain */
function ask(o){
  function submit(){
    var v=$('ans').value.replace(/[\s,]/g,'');
    if(!v)return;
    $('chk').disabled=true;$('ans').disabled=true;
    if(timer){clearInterval(timer);timer=null}
    var ok=(v===o.answer),pts=ok?o.pts(0):0;
    award(o.label,pts);
    $('fb').innerHTML=(ok?'<div class="msg ok">Correct: +'+pts+' points</div>'
      :'<div class="msg bad">Not correct: 0 points. The right answer is <b>'+o.answer+'</b>.</div>')
      +'<div class="note">'+o.explain+'</div>'+nextBtn();
    bindNext();
  }
  $('chk').onclick=submit;
  $('ans').onkeydown=function(e){if(e.key==='Enter')submit()};
}
function box(ph){return '<input id="ans" inputmode="numeric" placeholder="'+ph+'" autocomplete="off"><button id="chk">Submit</button><div id="fb"></div>'}

function intro(){
  $('bar').hidden=true;$('pg').hidden=true;
  app.innerHTML='<div class="tag">Orientation Day · Department of Mathematics</div><h1>The Math Escape Challenge</h1>'+
  '<p>Five rounds, one phone per team. Solve each challenge to unlock the next. Each question accepts one answer. You will see whether it was correct, the right answer, and the explanation. A speed bonus is awarded at the end.</p>'+
  '<input id="tn" placeholder="Enter your team name" maxlength="30" autocomplete="off"><button id="st">Start</button><div id="fb" class="msg bad"></div>';
  $('st').onclick=function(){
    var n=$('tn').value.trim();
    if(!n){$('fb').textContent='Please enter a team name.';return}
    S.team=n;S.t0=Date.now();go(1);
  };
}

function r1(){
  app.innerHTML='<div class="tag">Round 1 · The Code  · 100 pts</div><h2>Find the number</h2><div class="puzzle">I am a 2-digit number.<br>My digits add up to 9.<br>My tens digit is twice my units digit.<br><b>What am I?</b></div>'+box('Your answer');
  ask({answer:'63',label:'The Code',pts:function(w){return Math.max(20,100-20*w)},
  explain:'Let the units digit be u. Then the tens digit is 2u and 3u = 9, so u = 3 and the number is 63.',hint:'Write the digits as 2u and u, then use the sum.'});
}

function r2(){
  app.innerHTML='<div class="tag">Round 2 · The Gamble  · 100 pts</div><h2>Take the money or flip the coin?</h2><div class="puzzle">Take <b>$50</b> guaranteed, OR flip a coin:<br>Heads → <b>$120</b> · Tails → <b>$0</b></div><div id="ch"><button id="a">Take $50</button><button id="b" class="alt">Flip the coin</button></div><div id="fb"></div>';
  function after(txt){
    $('ch').innerHTML='';
    $('fb').innerHTML='<p>'+txt+'</p><p><b>Question:</b> On average, how many dollars does the coin flip pay? (Expected value)</p>'+box('Dollars');
    ask({answer:'60',label:'The Gamble',pts:function(w){return Math.max(20,100-20*w)},
    explain:'Expected value = 0.5 × 120 + 0.5 × 0 = 60. The coin flip is worth more on average than the guaranteed $50, although a single flip can still pay nothing.',hint:'Multiply each outcome by its probability and add.'});
  }
  $('a').onclick=function(){after('You chose the guaranteed $50.')};
  $('b').onclick=function(){var h=Math.random()<.5;after('The coin lands on <b>'+(h?'Heads: you win $120':'Tails: you win $0')+'</b>.')};
}

function r3(){
  app.innerHTML='<div class="tag">Round 3 · The Pattern  · 150 pts</div><h2>What comes next?</h2><div class="puzzle" style="text-align:center;font-size:20px">1, 11, 21, 1211, 111221, ______</div><p class="note">Clue: it is not an arithmetic rule. Read each term aloud and describe what you see.</p>'+box('Next term');
  ask({answer:'312211',label:'The Pattern',pts:function(w){return Math.max(30,150-30*w)},
  explain:'Each term describes the previous term, read aloud (the look-and-say sequence).<br>1 → "one 1" → 11<br>11 → "two 1s" → 21<br>21 → "one 2, one 1" → 1211<br>1211 → "one 1, one 2, two 1s" → 111221<br>111221 → "three 1s, two 2s, one 1" → <b>312211</b>',hint:'Read the previous term aloud: how many of each digit do you see?'});
}

function r4(){
  app.innerHTML='<div class="tag">Round 4 · Do Not Calculate  · 100 pts</div><h2>Ten seconds. No calculator.</h2><p class="note">Press the button when the whole team is ready. Full points if you answer within 10 seconds, half points afterwards.</p><button id="go">We are ready</button><div id="fb"></div>';
  $('go').onclick=function(){
    var t=Date.now();
    app.innerHTML='<div class="tag">Round 4 · Do Not Calculate</div><div class="big">99²</div><div class="big" id="cd" style="font-size:34px">10</div>'+box('Your answer');
    timer=setInterval(function(){var l=10-Math.floor((Date.now()-t)/1000);$('cd').textContent=l>0?l:'Time is up (half points)';if(l<=0){clearInterval(timer);timer=null}},200);
    var late=false;
    ask({answer:'9801',label:'Clever Calculation',pts:function(w){var e=(Date.now()-t)/1000;return (e<=10?100:50)},
    explain:'99² = (100 − 1)² = 10000 − 200 + 1 = 9801. The point is to find the convenient form before computing.'});
    var old=$('chk').onclick;
    $('chk').addEventListener('click',function(){if(timer&&$('ans').disabled){clearInterval(timer);timer=null}});
  };
}

function r5(){
  var st={sp:0,sw:0,tp:0,tw:0},prize,pick,open,phase=0;
  app.innerHTML='<div class="tag">Final Round · Monty Hall · 200 pts</div><h2>Stay or switch?</h2><p class="note">One door hides the prize. Pick a door, one empty door is opened, then decide. Play at least 10 games, then tell us which strategy wins more often.</p><div id="g"></div><div id="stats" class="note"></div><div id="fb"></div>';
  function stats(){
    $('stats').innerHTML='<table><tr><th>Strategy</th><th>Games</th><th>Wins</th></tr><tr><td>Stay</td><td>'+st.sp+'</td><td>'+st.sw+'</td></tr><tr><td>Switch</td><td>'+st.tp+'</td><td>'+st.tw+'</td></tr></table>';
    if(st.sp+st.tp>=10&&!$('q'))question();
  }
  function round(){
    prize=Math.floor(Math.random()*3);pick=null;open=null;phase=0;
    var h='<div class="doors">';
    for(var i=0;i<3;i++)h+='<button class="door" data-i="'+i+'">🚪<small>Door '+'ABC'[i]+'</small></button>';
    $('g').innerHTML='<p><b>Choose a door.</b></p>'+h+'</div>';
    var ds=$('g').querySelectorAll('.door');
    ds.forEach(function(d){d.onclick=function(){choose(+d.dataset.i)}});
  }
  function choose(i){
    pick=i;
    var c=[0,1,2].filter(function(x){return x!==pick&&x!==prize});
    open=c[Math.floor(Math.random()*c.length)];
    var h='<div class="doors">';
    for(var k=0;k<3;k++){
      h+='<div class="door'+(k===pick?' sel':'')+'">'+(k===open?'🐐':'🚪')+'<small>Door '+'ABC'[k]+(k===pick?' (yours)':k===open?' (empty)':'')+'</small></div>';
    }
    $('g').innerHTML='<p>Door '+'ABC'[open]+' is empty. <b>Stay or switch?</b></p>'+h+'</div><button id="s1">Stay</button><button id="s2" class="alt">Switch</button>';
    $('s1').onclick=function(){fin(false)};$('s2').onclick=function(){fin(true)};
  }
  function fin(sw){
    var f=sw?[0,1,2].filter(function(x){return x!==pick&&x!==open})[0]:pick;
    var win=f===prize;
    if(sw){st.tp++;if(win)st.tw++}else{st.sp++;if(win)st.sw++}
    var h='<div class="doors">';
    for(var k=0;k<3;k++)h+='<div class="door'+(k===f?' sel':'')+'">'+(k===prize?'🏆':'🐐')+'<small>Door '+'ABC'[k]+'</small></div>';
    $('g').innerHTML='<p class="msg '+(win?'ok':'bad')+'">'+(win?'You won the prize.':'No prize this time.')+'</p>'+h+'</div><button id="again">Play again</button>';
    $('again').onclick=round;stats();
  }
  function question(){
    var q=document.createElement('div');q.id='q';
    q.innerHTML='<hr><p><b>Which strategy wins more often in the long run?</b></p><button data-a="stay">Stay</button><button data-a="switch" class="alt">Switch</button><button data-a="same" class="alt">Both equal</button><div id="qf"></div>';
    $('fb').appendChild(q);
    q.querySelectorAll('button').forEach(function(b){b.onclick=function(){
      q.querySelectorAll('button').forEach(function(x){x.disabled=true});
      var ok=b.dataset.a==='switch',p=ok?200:0;
      award('Monty Hall',p);
      $('qf').innerHTML='<div class="msg '+(ok?'ok':'bad')+'">'+(ok?'Correct: +200 points':'Not correct: 0 points. The right answer is <b>switch</b>.')+'</div><div class="note">Your first pick is right with probability 1/3, and this stays 1/3 after a door is opened. The remaining closed door therefore carries 2/3, so switching wins twice as often as staying.</div><button id="nx">See results</button>';
      $('nx').onclick=function(){go(6)};
    }});
  }
  round();stats();
}

function final(){
  var secs=Math.round((Date.now()-S.t0)/1000);
  var bonus=secs<600?100:secs<900?50:0;
  if(bonus)award('Speed bonus',bonus);
  $('pgi').style.width='100%';
  var rows=S.detail.map(function(d){return '<tr><td>'+d[0]+'</td><td>'+d[1]+'</td></tr>'}).join('');
  app.innerHTML='<div class="tag">Mission complete</div><h1>Congratulations!</h1><p class="big" style="font-size:36px" id="tt"></p><table><tr><th>Challenge</th><th>Points</th></tr>'+rows+'<tr><td><b>Total</b></td><td><b>'+S.score+'</b></td></tr></table><p>Completion time: <b>'+fmt(secs)+'</b>. Show this screen to the organizers.</p><div class="puzzle">You just used logic, probability, patterns, algebra and problem solving, and you were doing mathematics the whole time. That is what the Mathematics program is about.</div>';
  $('tt').textContent=S.team;
}
intro();
</script>
</body>
</html>
